services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: starledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: starledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starledger -d starledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://starledger:${POSTGRES_PASSWORD}@postgres:5432/starledger
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      OPEN_SIGNUP: ${OPEN_SIGNUP:-false}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
    # Loopback only: the reverse proxy is the public entry point.
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-c", "node dist/cli.js migrate && node dist/index.js"]

volumes:
  pgdata:
