<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion (téléphone) — Starledger</title>
<link rel="stylesheet" href="../starledger.css">
</head>
<body>
<style>
body{margin:0}
</style>
<div class="sl-root" style="width: 390px; min-height: 844px; font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #c9cdd6">
  <main class="sl-auth">
    <div class="sl-card">
      <div class="sl-card-head" style="gap: 16px">
        <p class="sl-auth-brand">Starledger</p>
        <h1 class="sl-title">Connexion</h1>
      </div>
      <form class="sl-form" method="post" action="#">
        <div class="sl-field">
          <label class="sl-label" for="username">Identifiant</label>
          <input class="sl-input" id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="sl-field">
          <label class="sl-label" for="password">Mot de passe</label>
          <input class="sl-input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <a class="sl-btn sl-btn-primary sl-btn-block" href="account-phone.html" style="margin-top: 8px">Se connecter</a>
      </form>
    </div>
  </main>
</div>
</body>
</html>
