<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouveau mot de passe (téléphone) — Starledger</title>
<link rel="stylesheet" href="../starledger.css">
</head>
<body>
<style>
body{margin:0}
</style>
<div class="sl-root" style="width: 390px; min-height: 844px; font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #c9cdd6">
  <main class="sl-auth">
    <div class="sl-card">
      <div class="sl-card-head" style="gap: 16px">
        <p class="sl-auth-brand">Starledger</p>
        <div class="sl-page-head">
          <h1 class="sl-title">Nouveau mot de passe</h1>
          <p class="sl-lead">Compte : vega</p>
        </div>
      </div>
      <form class="sl-form" method="post" action="#">
        <input type="text" name="username" autocomplete="username" value="vega" hidden>
        <div class="sl-field">
          <label class="sl-label" for="new-password">Nouveau mot de passe</label>
          <input class="sl-input" id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="new-password-hint">
          <p class="sl-hint" id="new-password-hint">12 caractères minimum</p>
        </div>
        <a class="sl-btn sl-btn-primary sl-btn-block" href="login-phone.html" style="margin-top: 8px">Enregistrer le mot de passe</a>
      </form>
    </div>
  </main>
</div>
</body>
</html>
